[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chromatone"
version = "0.1.0"
description = "Spectral colour science toolkit: SPD, CIE XYZ/Lab, illuminants, delta-E, mixing"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Chromatone Contributors" },
]
keywords = [
    "color",
    "colour",
    "spectral",
    "SPD",
    "CIE",
    "XYZ",
    "Lab",
    "delta-E",
    "illuminant",
    "CMF",
    "imaging",
    "vision",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
chromatone = "chromatone.cli:main"

[project.urls]
Homepage = "https://example.com/chromatone"
Documentation = "https://example.com/chromatone"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chromatone = ["py.typed", "data/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
